<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Школа магии">
<meta name="theme-color" content="#7b5cd6">
<title>Школа магии</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="res" id="res-coins"><span class="ico">🪙</span><b id="coins">0</b></div>
    <div class="res" id="res-stars"><span class="ico">⭐</span><b id="stars">0</b></div>
    <div class="res" id="res-students"><span class="ico">🎓</span><b id="studcount">0</b></div>
    <button class="gear" id="btn-settings" aria-label="Настройки">⚙️</button>
  </header>
  <div id="quest"></div>
  <main id="screen"></main>
  <nav id="tabs">
    <button data-tab="school" class="active"><span>🏰</span>Школа</button>
    <button data-tab="students"><span>🎓</span>Ученики</button>
    <button data-tab="build"><span>🔨</span>Строить</button>
  </nav>
</div>
<div id="sheet-wrap" class="hidden"><div id="sheet-bg"></div><div id="sheet"></div></div>
<div id="fx"></div>
<script type="module" src="js/game.js"></script>
</body>
</html>
